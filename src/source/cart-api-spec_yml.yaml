openapi: 3.0.3
info:
  title: Gorogoro Cart API
  version: 1.0.2
  description: |
    Cart 서비스 API.
    운영 환경에서는 클라이언트가 직접 X-User-Id를 넣지 않고 Authorization: Bearer <JWT> 를 통해 인증합니다.
    API Gateway가 토큰에서 user id를 추출하여 downstream 요청에 X-User-Id 헤더를 추가합니다.

servers:
  - url: http://localhost:8080
    description: Local (for dev integration via gateway)

security:
  - bearerAuth: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    XUserIdHeader:
      name: X-User-Id
      in: header
      required: false
      description: >
        **Gateway가 Authorization 토큰에서 추출하여 설정합니다.**
        운영 환경에서는 클라이언트가 직접 설정하지 마세요.
        Swagger UI에서 테스트할 때는 Authorization에 JWT를 설정하고 Gateway를 통해 호출해 주세요.
      schema:
        type: integer
        format: int64
        readOnly: true

  schemas:
    AddCartRequest:
      type: object
      required:
        - courseId
      properties:
        courseId:
          type: integer
          format: int64
          description: 장바구니에 추가할 강의 ID
          example: 123

    RemoveCartItemRequest:
      type: object
      required:
        - courseId
      properties:
        courseId:
          type: integer
          format: int64
          description: 장바구니에서 삭제할 강의 ID
          example: 123

    CartItemResponse:
      type: object
      properties:
        categoryDetail:
          type: object
          properties:
            categoryId:
              type: integer
              format: int64
              description: 상위 카테고리 ID
              example: 1
            name:
              type: string
              description: 상위 카테고리 이름
              example: "Development"
            subCategoryDetail:
              type: object
              properties:
                subCategoryId:
                  type: integer
                  format: int64
                  description: 하위 카테고리 ID
                  example: 2
                name:
                  type: string
                  description: 하위 카테고리 이름
                  example: "Backend"
        courseId:
          type: integer
          format: int64
          description: Course identifier
          example: 1000
        courseTitle:
          type: string
          description: 강의 제목
          example: "Spring Boot으로 배우는 백엔드 기본"
        instructorName:
          type: string
          description: 강사 이름
          example: "홍강사"
        price:
          type: integer
          description: 가격(원)
          example: 42000
        coverImgUrl:
          type: string
          description: 커버 이미지 URL
          example: "https://cdn.example.com/covers/spring-boot-basics.jpg"
        addedAt:
          type: string
          format: date-time
          description: When this item was added to the cart
          example: "2025-12-09T05:43:12.082029Z"

    CartSummary:
      type: object
      properties:
        totalCount:
          type: integer
          example: 2
        totalAmount:
          type: integer
          example: 140000

    CartResponse:
      type: object
      properties:
        owner_id:
          type: integer
          format: int64
          description: Cart owner id
          example: 1
        items:
          type: array
          items:
            $ref: '#/components/schemas/CartItemResponse'
        summary:
          $ref: '#/components/schemas/CartSummary'
      example:
        owner_id: 1
        items:
          - categoryDetail:
              categoryId: 1
              name: "Development"
              subCategoryDetail:
                subCategoryId: 2
                name: "Backend"
            courseId: 1000
            courseTitle: "Spring Boot으로 배우는 백엔드 기본"
            instructorName: "홍강사"
            price: 42000
            coverImgUrl: "https://cdn.example.com/covers/spring-boot-basics.jpg"
            addedAt: "2025-12-09T05:43:12.082029Z"
          - categoryDetail:
              categoryId: 4
              name: "Design"
              subCategoryDetail:
                subCategoryId: 5
                name: "UX/UI"
            courseId: 1001
            courseTitle: "실전 웹 서비스 만들기 with Spring"
            instructorName: "이강사"
            price: 98000
            coverImgUrl: "https://cdn.example.com/covers/fullstack-service.jpg"
            addedAt: "2025-12-09T06:29:06.687364Z"
        summary:
          totalCount: 2
          totalAmount: 140000

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          description: Error code identifier (서비스 내 ErrorCode enum의 code)
          example: CRT-5000
        message:
          type: string
          description: Human-readable error description (한국어)
          example: 서버에 예상치 못한 오류가 발생했습니다.

paths:
  /api/carts:
    post:
      tags:
        - Cart
      summary: Add a course to user's cart
      operationId: addCourseToCart
      parameters:
        - $ref: '#/components/parameters/XUserIdHeader'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddCartRequest'
      responses:
        '200':
          description: Course added to cart (OK)
        '400':
          description: Bad Request (validation failure)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInput:
                  summary: 잘못된 입력 예시
                  value:
                    code: CRT-1000
                    message: 입력값이 올바르지 않습니다.
                missingParam:
                  summary: 필수 파라미터 누락 예시
                  value:
                    code: CRT-1001
                    message: 필수 요청 파라미터가 누락되었습니다.
        '401':
          description: Unauthorized (invalid or missing JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (access denied)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict (e.g., course not purchasable / already enrolled / already in cart)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notPurchasable:
                  summary: 현재 구매 불가
                  value:
                    code: CRT-2000
                    message: 현재 구매할 수 없는 강의입니다.
                alreadyEnrolled:
                  summary: 이미 수강 중
                  value:
                    code: CRT-2001
                    message: 이미 수강 중인 강의입니다.
                alreadyInCart:
                  summary: 이미 장바구니에 존재
                  value:
                    code: CRT-2002
                    message: 이미 장바구니에 담긴 강의입니다.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  summary: 서버 내부 오류 예시
                  value:
                    code: CRT-5000
                    message: 서버에 예상치 못한 오류가 발생했습니다.
        '503':
          description: Service Unavailable (external course service)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                courseSvcDown:
                  summary: 강의 서비스 응답 없음
                  value:
                    code: CRT-5001
                    message: 강의 서비스가 응답하지 않습니다.

    get:
      tags:
        - Cart
      summary: Get cart items for the user
      operationId: getCartItems
      parameters:
        - $ref: '#/components/parameters/XUserIdHeader'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Cart response with items and summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CartResponse'
              examples:
                sample:
                  summary: Example cart response
                  value:
                    owner_id: 1
                    items:
                      - categoryDetail:
                          categoryId: 1
                          name: "Development"
                          subCategoryDetail:
                            subCategoryId: 2
                            name: "Backend"
                        courseId: 1000
                        courseTitle: "Spring Boot으로 배우는 백엔드 기본"
                        instructorName: "홍강사"
                        price: 42000
                        coverImgUrl: "https://cdn.example.com/covers/spring-boot-basics.jpg"
                        addedAt: "2025-12-09T05:43:12.082029Z"
                      - categoryDetail:
                          categoryId: 4
                          name: "Design"
                          subCategoryDetail:
                            subCategoryId: 5
                            name: "UX/UI"
                        courseId: 1001
                        courseTitle: "실전 웹 서비스 만들기 with Spring"
                        instructorName: "이강사"
                        price: 98000
                        coverImgUrl: "https://cdn.example.com/covers/fullstack-service.jpg"
                        addedAt: "2025-12-09T06:29:06.687364Z"
                    summary:
                      totalCount: 2
                      totalAmount: 140000
        '401':
          description: Unauthorized (invalid or missing JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (access denied)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    code: CRT-5000
                    message: 서버에 예상치 못한 오류가 발생했습니다.

    delete:
      tags:
        - Cart
      summary: Clear all items in user's cart
      operationId: clearCart
      parameters:
        - $ref: '#/components/parameters/XUserIdHeader'
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cart cleared (No Content)
        '401':
          description: Unauthorized (invalid or missing JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (access denied)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    code: CRT-5000
                    message: 서버에 예상치 못한 오류가 발생했습니다.

  /api/carts/items:
    delete:
      tags:
        - Cart
      summary: Remove a single course item from user's cart
      operationId: removeCartItem
      parameters:
        - $ref: '#/components/parameters/XUserIdHeader'
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveCartItemRequest'
      responses:
        '204':
          description: Item removed from cart (No Content)
        '400':
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                invalidInput:
                  value:
                    code: CRT-1000
                    message: 입력값이 올바르지 않습니다.
        '401':
          description: Unauthorized (invalid or missing JWT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden (access denied)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not Found (item not in cart)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                notFound:
                  value:
                    code: CRT-4000
                    message: 장바구니에 해당 강좌가 없습니다.
        '500':
          description: Internal Server Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                internalError:
                  value:
                    code: CRT-5000
                    message: 서버에 예상치 못한 오류가 발생했습니다.