openapi: 3.0.3
info:
  title: Course API
  version: 1.0.0

paths:
  /api/v1/courses:
    post:
      summary: "강좌 생성"
      description: "강사가 새로운 강좌를 생성합니다."
      tags:
        - Courses
      operationId: createCourse
      security:
        - bearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCourseRequest'
      responses:
        '201':
          description: "강좌가 성공적으로 생성되었습니다. (응답 본문 없음)"
        '400':
          description: "요청 값이 유효하지 않거나 중복된 시퀀스가 존재합니다. (VALIDATION_ERROR, COS-0011)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                createCourseValidation:
                  summary: "CreateCourseRequest Validation 에러 예시"
                  value:
                    message: "입력값이 올바르지 않습니다."
                    code: "VALIDATION_ERROR"
                    errors:
                      - field: "title"
                        reason: "강좌 제목을 작성해주세요."
                      - field: "title"
                        reason: "강좌 제목은 30자까지만 가능합니다."
                      - field: "summary"
                        reason: "강좌 소개를 작성해주세요."
                      - field: "summary"
                        reason: "강좌 소개는 200자까지만 가능합니다."
                      - field: "description"
                        reason: "강좌 설명을 작성해주세요."
                      - field: "description"
                        reason: "강좌 설명은 1000자까지만 가능합니다."
                      - field: "categoryId"
                        reason: "카테고리를 선택해주세요."
                      - field: "price"
                        reason: "금액을 입력해주세요."
                      - field: "price"
                        reason: "금액은 0이상 설젇해주세요."
                      - field: "coverImageUrl"
                        reason: ""   # @NotBlank(message = "")
                      - field: "courseDifficulty"
                        reason: "강좌의 난이도를 선택해주세요"
                      - field: "availableDays"
                        reason: "이용가능한 날을 선택해주세요"
                      - field: "availableDays"
                        reason: "이용 가능한 날은 0이상 설정해주세요."
                duplicatedSeq:
                  summary: "비즈니스 오류 - 중복 시퀀스"
                  value:
                    message: "중복된 시퀀스가 존재합니다."
                    code: "COS-0011"
        '401':
          description: "인증 실패"
    get:
      summary: "강좌 요약 목록 조회"
      description: "전체 강좌의 요약 정보를 조회합니다."
      tags:
        - Courses
      operationId: getCoursesSummary
      parameters:
        - name: categoryId
          in: query
          required: true
          description: "카테고리 ID"
          schema:
            type: integer
            format: int64
            nullable: false
      responses:
        '200':
          description: "강좌 요약 목록"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSummaryResponse'

  /api/v1/courses/{courseId}:
    get:
      summary: "강좌 상세 조회"
      description: "특정 강좌의 상세 정보를 조회합니다."
      tags:
        - Courses
      operationId: getCourseDetail
      parameters:
        - name: courseId
          in: path
          required: true
          description: "조회할 강좌 ID"
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "강좌 상세 정보"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseDetailResponse'
        '404':
          description: "강좌를 찾을 수 없습니다. (COS-0012)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "강좌를 찾을 수 없습니다."
                code: "COS-0012"
    put:
      summary: "강좌 수정"
      description: "강사가 자신의 강좌 정보를 수정합니다."
      tags:
        - Courses
      operationId: updateCourse
      security:
        - bearerAuth: [ ]
      parameters:
        - name: courseId
          in: path
          required: true
          description: "수정할 강좌 ID"
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCourseRequest'
      responses:
        '204':
          description: "강좌가 성공적으로 수정되었습니다. (응답 본문 없음)"
        '400':
          description: "요청 값이 유효하지 않거나 중복된 시퀀스가 존재합니다. (VALIDATION_ERROR, COS-0011)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                updateCourseValidation:
                  summary: "UpdateCourseRequest Validation 에러 예시"
                  value:
                    message: "입력값이 올바르지 않습니다."
                    code: "VALIDATION_ERROR"
                    errors:
                      - field: "title"
                        reason: "강좌 제목은 30자까지만 가능합니다."
                      - field: "summary"
                        reason: "강좌 소개는 200자까지만 가능합니다."
                      - field: "description"
                        reason: "강좌 설명은 1000자까지만 가능합니다."
                      - field: "price"
                        reason: "금액은 0보다 크게 작성해주세요."
                      - field: "availableDays"
                        reason: "이용 가능한 날은 0이상 설정해주세요."
                      - field: "contents[0].chapterId"
                        reason: "변경하려는 챕터의 id가 꼭 포함되어야 합니다."
                      - field: "contents[0].title"
                        reason: "챕터 제목은 30자까지만 가능합니다."
                      - field: "contents[0].lessons[0].lessonId"
                        reason: "변경하려는 레슨의 id가 꼭 포함되어야 합니다."
                      - field: "contents[0].lessons[0].title"
                        reason: "레슨 제목은 30자까지만 가능합니다."
                duplicatedSeq:
                  summary: "비즈니스 오류 - 중복 시퀀스"
                  value:
                    message: "중복된 시퀀스가 존재합니다."
                    code: "COS-0011"
        '401':
          description: "인증 실패"
        '403':
          description: "해당 강좌에 대한 권한이 없습니다. (COS-0013)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "해당 유저는 강의의 소유자가 아닙니다."
                code: "COS-0013"
        '404':
          description: "강좌를 찾을 수 없습니다. (COS-0012)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "강좌를 찾을 수 없습니다."
                code: "COS-0012"
    delete:
      summary: "강좌 삭제"
      description: "강사가 자신의 강좌를 삭제합니다."
      tags:
        - Courses
      operationId: deleteCourse
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: "삭제할 강좌 ID"
          schema:
            type: integer
            format: int64
      responses:
        '204':
          description: "강좌가 성공적으로 삭제되었습니다. (응답 본문 없음)"
        '401':
          description: "인증 실패"
        '403':
          description: "해당 강좌에 대한 권한이 없습니다. (COS-0013)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "해당 유저는 강의의 소유자가 아닙니다."
                code: "COS-0013"
        '404':
          description: "강좌를 찾을 수 없습니다. (COS-0012)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "강좌를 찾을 수 없습니다."
                code: "COS-0012"

  /api/v1/courses/{courseId}/chapters:
    delete:
      summary: "챕터 삭제"
      description: "강사가 특정 강좌의 여러 챕터를 한 번에 삭제합니다."
      tags:
        - Courses
      operationId: deleteChapters
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: "챕터를 삭제할 강좌 ID"
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteChaptersRequest'
      responses:
        '204':
          description: "챕터가 성공적으로 삭제되었습니다. (응답 본문 없음)"
        '401':
          description: "인증 실패"
        '403':
          description: "해당 강좌에 대한 권한이 없습니다. (COS-0013)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "해당 유저는 강의의 소유자가 아닙니다."
                code: "COS-0013"
        '404':
          description: "강좌를 찾을 수 없습니다. (COS-0012)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "강좌를 찾을 수 없습니다."
                code: "COS-0012"

  /api/v1/courses/{courseId}/chapters/{chapterId}/lessons:
    delete:
      summary: "레슨 삭제"
      description: "강사가 특정 챕터의 여러 레슨을 한 번에 삭제합니다."
      tags:
        - Courses
      operationId: deleteLessons
      security:
        - bearerAuth: []
      parameters:
        - name: courseId
          in: path
          required: true
          description: "레슨을 삭제할 강좌 ID"
          schema:
            type: integer
            format: int64
        - name: chapterId
          in: path
          required: true
          description: "레슨을 삭제할 챕터 ID"
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteLessonsRequest'
      responses:
        '204':
          description: "레슨이 성공적으로 삭제되었습니다. (응답 본문 없음)"
        '401':
          description: "인증 실패"
        '403':
          description: "해당 강좌에 대한 권한이 없습니다. (COS-0013)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "해당 유저는 강의의 소유자가 아닙니다."
                code: "COS-0013"
        '404':
          description: "강좌를 찾을 수 없습니다. (COS-0012)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "강좌를 찾을 수 없습니다."
                code: "COS-0012"

  /api/instructor/courses:
    get:
      summary: "강사 본인 강좌 요약 조회"
      description: "인증된 강사의 강좌 요약 목록을 조회합니다."
      tags:
        - InstructorCourses
      operationId: getInstructorCoursesSummary
      security:
        - bearerAuth: []
      responses:
        '200':
          description: "강사의 강좌 요약 목록"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseSummaryInstructorResponse'
        '401':
          description: "인증 실패"

  /api/categories:
    get:
      summary: "카테고리 목록 조회"
      description: "카테고리 및 하위 카테고리 목록을 조회합니다."
      tags:
        - Categories
      operationId: getCategories
      responses:
        '200':
          description: "카테고리 목록"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoriesResponse'
  /api/enrollments:
    post:
      summary: "수강 신청"
      description: "사용자가 특정 강좌를 수강 신청합니다."
      tags:
        - Enrollments
      operationId: createEnrollment
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: "요청 사용자 ID"
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentRequest'
            examples:
              createEnrollment:
                summary: "수강 신청 요청 예시"
                value:
                  courseId: 1
      responses:
        '201':
          description: "수강 신청이 성공적으로 생성되었습니다. (응답 본문 없음)"
        '400':
          description: "요청 값이 유효하지 않습니다. (VALIDATION_ERROR)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                createEnrollmentValidation:
                  summary: "CreateEnrollmentRequest Validation 에러 예시"
                  value:
                    message: "입력값이 올바르지 않습니다."
                    code: "VALIDATION_ERROR"
                    errors:
                      - field: "courseId"
                        reason: "courseId는 필수입니다."
        '401':
          description: "인증 실패"
        '404':
          description: "강좌를 찾을 수 없습니다. (예: COS-0012)"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: "강좌를 찾을 수 없습니다."
                code: "COS-0012"

    get:
      summary: "내 수강 목록 조회"
      description: "사용자가 수강 중인 강좌 목록을 조회합니다."
      tags:
        - Enrollments
      operationId: getEnrolledCourses
      parameters:
        - name: X-User-Id
          in: header
          required: true
          description: "요청 사용자 ID"
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: "수강 중인 강좌 목록"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolledCourseResponse'
              examples:
                enrolledCourses:
                  summary: "수강 목록 응답 예시"
                  value:
                    contents:
                      - courseId: 1
                        courseTitle: "스프링 부트 마스터"
                        instructorName: "홍길동"
                        coverImage: "https://cdn.example.com/covers/1.png"
                      - courseId: 2
                        courseTitle: "Kafka 실전"
                        instructorName: "김철수"
                        coverImage: "https://cdn.example.com/covers/2.png"
        '401':
          description: "인증 실패"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    # 공통 에러 응답 (비즈니스 + Validation 겸용)
    ErrorResponse:
      type: object
      description: "비즈니스 에러 또는 Validation 에러 응답 형식"
      properties:
        message:
          type: string
          description: "에러 메시지"
          example: "강좌를 찾을 수 없습니다."
        code:
          type: string
          description: "에러 코드"
          example: "COS-0012"
        errors:
          type: array
          description: "필드 Validation 오류 목록 (Validation 에러일 때만 사용)"
          items:
            $ref: '#/components/schemas/ValidationError'

    ValidationError:
      type: object
      description: "단일 필드 Validation 에러 정보"
      properties:
        field:
          type: string
          description: "에러가 발생한 필드명"
          example: "title"
        reason:
          type: string
          description: "에러 사유"
          example: "강좌 제목은 30자까지만 가능합니다."

    # -----------------------------
    # Create Course
    # -----------------------------
    CreateCourseRequest:
      type: object
      required:
        - title
        - summary
        - description
        - categoryId
        - price
        - coverImageUrl
        - courseDifficulty
        - availableDays
      properties:
        title:
          type: string
          maxLength: 30
          description: "강좌 제목 (최대 30자)"
        summary:
          type: string
          maxLength: 200
          description: "강좌 소개 (최대 200자)"
        description:
          type: string
          maxLength: 1000
          description: "강좌 설명 (최대 1000자)"
        categoryId:
          type: integer
          format: int64
          description: "카테고리 ID"
        price:
          type: integer
          format: int32
          minimum: 0
          description: "강좌 금액 (0 이상)"
        coverImageUrl:
          type: string
          description: "강좌 대표 이미지 URL"
        courseDifficulty:
          $ref: '#/components/schemas/CourseDifficulty'
        contents:
          type: array
          description: "강좌의 챕터 및 레슨 구성"
          items:
            $ref: '#/components/schemas/CreateChapterRequest'
        availableDays:
          type: integer
          format: int32
          minimum: 0
          description: "이용 가능한 날 수 (0 이상)"

    CreateChapterRequest:
      type: object
      required:
        - title
        - seq
      properties:
        title:
          type: string
          maxLength: 30
          description: "챕터 제목 (최대 30자)"
        seq:
          type: integer
          format: int32
          description: "챕터 순서"
        lessons:
          type: array
          description: "해당 챕터의 레슨 목록"
          items:
            $ref: '#/components/schemas/CreateLessonRequest'

    CreateLessonRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 30
          description: "레슨 제목 (최대 30자)"
        seq:
          type: integer
          format: int32
          nullable: true
          description: "레슨 순서 (선택)"
        resourceUrl:
          type: string
          nullable: true
          description: "레슨 리소스 URL (영상/문서 등)"

    # -----------------------------
    # Course Summary (public)
    # -----------------------------
    CourseSummaryResponse:
      type: object
      properties:
        contents:
          type: array
          description: "강좌 요약 목록"
          items:
            $ref: '#/components/schemas/CourseSummaryContent'
      required:
        - contents

    CourseSummaryContent:
      type: object
      properties:
        courseId:
          type: integer
          format: int64
          description: "강좌 ID"
        title:
          type: string
          description: "강좌 제목"
        price:
          type: integer
          format: int32
          description: "강좌 가격"
        name:
          type: string
          description: "강좌와 관련된 이름 (예: 강사 이름)"
        coverImageUrl:
          type: string
          description: "강좌 대표 이미지 URL"
        category:
          $ref: '#/components/schemas/SubCategoryContentWithParent'
      required:
        - courseId
        - title
        - price
        - name
        - coverImageUrl

    # -----------------------------
    # Update Course
    # -----------------------------
    UpdateCourseRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 30
          nullable: true
          description: "강좌 제목 (최대 30자)"
        summary:
          type: string
          maxLength: 200
          nullable: true
          description: "강좌 소개 (최대 200자)"
        description:
          type: string
          maxLength: 1000
          nullable: true
          description: "강좌 설명 (최대 1000자)"
        categoryId:
          type: integer
          format: int64
          nullable: true
          description: "카테고리 ID"
        price:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: "강좌 금액 (0 이상)"
        coverImageUrl:
          type: string
          nullable: true
          description: "강좌 대표 이미지 URL"
        courseDifficulty:
          $ref: '#/components/schemas/CourseDifficulty'
        contents:
          type: array
          nullable: true
          description: "챕터 및 레슨 수정 정보"
          items:
            $ref: '#/components/schemas/UpdateChapterRequest'
        availableDays:
          type: integer
          format: int32
          minimum: 0
          nullable: true
          description: "이용 가능한 날 수 (0 이상)"

    UpdateChapterRequest:
      type: object
      required:
        - chapterId
      properties:
        chapterId:
          type: integer
          format: int64
